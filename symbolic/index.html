<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Symbolic — AI Product Operating System</title>
<meta name="description" content="Symbolic is the operating system for creating software companies. From idea to production-ready product, in one calm, intelligent workspace. By B.Symbolic.">
<meta name="theme-color" content="#0C0E0D" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#FAF7F5" media="(prefers-color-scheme: light)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,800&family=Playfair+Display:wght@700;800;900&family=Inter:wght@400;450;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================ TOKENS ============================ */
:root{
  --oxblood:#B0474B; --accent:#69F0A5; --accent-deep:#2D8858; --amber:#FFCC66; --red:#ff6b6b; --blue:#7cc7ff; --violet:#c79bff;
  --display:'Playfair Display',Georgia,serif;
  --serif:'Fraunces',Georgia,serif;
  --sans:'Inter',-apple-system,system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --r1:8px; --r2:12px; --r3:16px; --r4:22px;
  --sp:4px;
  --ease:cubic-bezier(.2,.7,.2,1);
}
html[data-theme="dark"]{
  --bg:#0C0E0D; --surface:#131817; --surface2:#0f1413; --raised:#182220;
  --ink:#E8EFE9; --muted:#7D8B82; --faint:#4b544f; --line:#222b27; --line2:#2c3833;
  --shadow:0 18px 48px -18px rgba(0,0,0,.75), 0 2px 6px rgba(0,0,0,.4);
  --grad: radial-gradient(900px 480px at 92% -10%, rgba(176,71,75,.14), transparent 60%),
          radial-gradient(760px 520px at -10% 108%, rgba(105,240,165,.06), transparent 55%);
  --oxblood:#B0474B; --accent:#69F0A5;
}
html[data-theme="light"]{
  --bg:#FAF7F5; --surface:#FFFFFF; --surface2:#F4EFEC; --raised:#FFFFFF;
  --ink:#1A1D1B; --muted:#6B7670; --faint:#A9B0AB; --line:#E7E0DB; --line2:#DAD2CC;
  --shadow:0 18px 40px -22px rgba(60,40,30,.35), 0 1px 3px rgba(60,40,30,.08);
  --grad: radial-gradient(900px 480px at 92% -12%, rgba(143,52,55,.08), transparent 60%),
          radial-gradient(760px 520px at -10% 108%, rgba(27,158,90,.05), transparent 55%);
  --oxblood:#8F3437; --accent:#1B9E5A; --accent-deep:#137a45; --amber:#B7791F;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{background:var(--grad),var(--bg); color:var(--ink); font-family:var(--sans);
  -webkit-font-smoothing:antialiased; font-size:15px; line-height:1.5; overflow-x:hidden;}
::selection{background:var(--accent); color:#0C0E0D;}
a{color:inherit; text-decoration:none;}
button{font-family:inherit; cursor:pointer; border:0; background:none; color:inherit;}
input,textarea,select{font-family:inherit;}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px;}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important; transition-duration:.001ms!important;}}

/* ============================ LAYOUT ============================ */
.app{display:grid; grid-template-columns:248px 1fr; min-height:100vh;}
/* Sidebar */
aside{position:sticky; top:0; height:100vh; border-right:1px solid var(--line);
  background:linear-gradient(180deg,var(--surface),var(--surface2)); display:flex; flex-direction:column; padding:16px 12px; gap:6px; z-index:20;}
.brand{display:flex; align-items:center; gap:11px; padding:6px 8px 14px;}
.mark{width:38px; height:38px; border-radius:11px; flex:none;
  background:linear-gradient(140deg,var(--oxblood),#5e2224); color:#FAF6F4;
  display:grid; place-items:center; font-family:var(--display); font-weight:800; font-size:20px; box-shadow:inset 0 1px 0 rgba(255,255,255,.15);}
.brand .nm{font-family:var(--serif); font-weight:800; font-size:19px; letter-spacing:-.02em;}
.brand .nm .d{color:var(--accent);}
.brand .tag{font-family:var(--mono); font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin-top:1px;}
.navlbl{font-family:var(--mono); font-size:9.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--faint); padding:12px 10px 6px;}
.nav{display:flex; flex-direction:column; gap:2px;}
.nav a{display:flex; align-items:center; gap:11px; padding:9px 11px; border-radius:var(--r1); color:var(--muted);
  font-weight:500; font-size:13.5px; transition:.14s var(--ease); position:relative;}
.nav a:hover{color:var(--ink); background:var(--surface2);}
.nav a.on{color:var(--ink); background:var(--surface2);}
.nav a.on::before{content:''; position:absolute; left:-12px; top:8px; bottom:8px; width:3px; border-radius:0 3px 3px 0; background:var(--accent);}
.nav a svg{width:17px; height:17px; flex:none; stroke-width:1.9;}
.nav a .ct{margin-left:auto; font-family:var(--mono); font-size:10px; color:var(--muted); background:var(--surface); border:1px solid var(--line); border-radius:99px; padding:1px 7px;}
.side-foot{margin-top:auto; display:flex; flex-direction:column; gap:8px; padding-top:12px; border-top:1px solid var(--line);}
.themebtn{display:flex; align-items:center; gap:9px; padding:8px 11px; border-radius:var(--r1); color:var(--muted); font-size:13px; font-weight:500; transition:.14s;}
.themebtn:hover{background:var(--surface2); color:var(--ink);}
.themebtn svg{width:16px; height:16px;}
.byline{font-family:var(--mono); font-size:9.5px; color:var(--faint); padding:2px 11px;}
.byline a{color:var(--oxblood); font-weight:600;}

/* Topbar */
main{min-width:0; display:flex; flex-direction:column;}
.topbar{position:sticky; top:0; z-index:15; display:flex; align-items:center; gap:12px;
  padding:12px 26px; background:color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter:blur(12px); border-bottom:1px solid var(--line);}
.crumb{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted); font-weight:500; min-width:0;}
.crumb b{color:var(--ink); font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.crumb .sep{color:var(--faint);}
.cmdk{margin-left:auto; display:flex; align-items:center; gap:9px; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r1); padding:7px 12px; color:var(--muted); font-size:13px; transition:.14s; min-width:180px;}
.cmdk:hover{border-color:var(--line2); color:var(--ink);}
.cmdk svg{width:15px; height:15px;}
.cmdk .kbd{margin-left:auto;}
.kbd{font-family:var(--mono); font-size:10.5px; border:1px solid var(--line); border-bottom-width:2px; border-radius:5px; padding:1px 6px; color:var(--muted); background:var(--surface2);}
.icobtn{width:36px; height:36px; border-radius:var(--r1); display:grid; place-items:center; color:var(--muted); border:1px solid var(--line); background:var(--surface); transition:.14s;}
.icobtn:hover{color:var(--ink); border-color:var(--line2);}
.icobtn svg{width:17px; height:17px; stroke-width:1.9;}

.scroll{flex:1; overflow-y:auto; padding:26px 26px 80px;}
.container{max-width:1080px; margin:0 auto;}

/* ============================ PRIMITIVES ============================ */
.h1{font-family:var(--serif); font-weight:800; font-size:30px; letter-spacing:-.02em; line-height:1.1;}
.h1 .d{color:var(--accent);}
.h2{font-family:var(--serif); font-weight:700; font-size:21px; letter-spacing:-.01em;}
.lede{color:var(--muted); font-size:15px; max-width:60ch; margin-top:6px; line-height:1.55;}
.eyebrow{font-family:var(--mono); font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:var(--muted);}
.eyebrow .d{color:var(--accent);}
.card{background:linear-gradient(180deg,var(--surface),var(--surface2)); border:1px solid var(--line); border-radius:var(--r3); padding:22px;}
.card.flat{background:var(--surface);}
.card + .card, .stack > * + *{margin-top:14px;}
.muted{color:var(--muted);}
.mono{font-family:var(--mono);}
.row{display:flex; gap:12px; flex-wrap:wrap; align-items:center;}
.between{display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;}
.spacer{flex:1;}
.grid{display:grid; gap:16px;}
hr{border:0; border-top:1px solid var(--line); margin:18px 0;}

.btn{display:inline-flex; align-items:center; gap:8px; font-weight:600; font-size:14px; padding:10px 17px; border-radius:var(--r2);
  transition:.15s var(--ease); border:1px solid transparent; white-space:nowrap;}
.btn svg{width:16px; height:16px; stroke-width:2;}
.btn.primary{background:var(--accent); color:#08130c;} .btn.primary:hover{filter:brightness(1.06); transform:translateY(-1px); box-shadow:0 8px 20px -8px var(--accent);}
.btn.ghost{border-color:var(--line); color:var(--ink); background:var(--surface);} .btn.ghost:hover{border-color:var(--line2); background:var(--surface2);}
.btn.ox{background:var(--oxblood); color:#FAF6F4;} .btn.ox:hover{filter:brightness(1.08);}
.btn.sm{font-size:12.5px; padding:7px 12px; border-radius:var(--r1);}
.btn.tiny{font-size:11.5px; padding:5px 9px; border-radius:var(--r1); gap:5px;}
.btn:disabled{opacity:.4; cursor:not-allowed; transform:none; box-shadow:none;}

.badge{display:inline-flex; align-items:center; gap:6px; font-family:var(--mono); font-size:10.5px; font-weight:500;
  border:1px solid var(--line); border-radius:99px; padding:3px 10px; color:var(--muted); background:var(--surface);}
.badge.dot::before{content:''; width:6px; height:6px; border-radius:50%; background:var(--accent);}
.badge.ok{color:var(--accent-deep); border-color:color-mix(in srgb,var(--accent) 40%,transparent);}
.badge.warn{color:var(--amber); border-color:color-mix(in srgb,var(--amber) 40%,transparent);}
.badge.ox{color:var(--oxblood); border-color:color-mix(in srgb,var(--oxblood) 40%,transparent);}

.chip{font-family:var(--mono); font-size:10.5px; color:var(--muted); border:1px solid var(--line); border-radius:99px; padding:4px 11px; background:var(--surface2);}

input[type=text], textarea, select{width:100%; background:var(--surface2); color:var(--ink); border:1px solid var(--line);
  border-radius:var(--r2); padding:11px 13px; font-size:14px; line-height:1.55; transition:.14s;}
textarea{resize:vertical; min-height:96px; font-family:var(--sans);}
input:focus, textarea:focus, select:focus{outline:none; border-color:var(--accent); background:var(--surface);}
label.fld{display:block; margin-bottom:14px;}
label.fld .lb{display:block; font-size:12.5px; font-weight:600; margin-bottom:6px; color:var(--ink);}
label.fld .hint{font-size:11.5px; color:var(--muted); margin-bottom:6px; font-weight:400;}

/* progress */
.prog{height:7px; background:var(--surface2); border:1px solid var(--line); border-radius:99px; overflow:hidden;}
.prog i{display:block; height:100%; background:linear-gradient(90deg,var(--accent-deep),var(--accent)); width:0; transition:width .6s var(--ease);}
.skel{background:linear-gradient(100deg,var(--surface2) 30%, var(--line) 50%, var(--surface2) 70%); background-size:200% 100%; animation:sk 1.3s infinite; border-radius:8px;}
@keyframes sk{to{background-position:-200% 0;}}

/* ============================ WORKSPACE ============================ */
.hero{position:relative; overflow:hidden; border-radius:var(--r4); border:1px solid var(--line);
  background:linear-gradient(180deg,var(--surface),var(--surface2)); padding:34px 32px; margin-bottom:26px;}
.hero::after{content:''; position:absolute; inset:0; background:radial-gradient(600px 300px at 88% -30%, color-mix(in srgb,var(--oxblood) 22%,transparent), transparent 70%); pointer-events:none;}
.hero .h1{font-size:34px; max-width:20ch;}
.launcher{margin-top:22px; display:flex; gap:10px; max-width:640px; position:relative; z-index:2;}
.launcher input{font-size:15.5px; padding:14px 16px;}
.cardgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:16px;}
.pcard{text-align:left; background:linear-gradient(180deg,var(--surface),var(--surface2)); border:1px solid var(--line);
  border-radius:var(--r3); padding:20px; transition:.16s var(--ease); position:relative; overflow:hidden; display:flex; flex-direction:column; gap:12px;}
.pcard:hover{transform:translateY(-2px); border-color:var(--line2); box-shadow:var(--shadow);}
.pcard .pt{font-family:var(--serif); font-weight:700; font-size:18px; letter-spacing:-.01em; line-height:1.2;}
.pcard .pd{font-size:13px; color:var(--muted); line-height:1.45; min-height:36px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
.pcard .pfoot{display:flex; align-items:center; justify-content:space-between; margin-top:auto;}
.score{font-family:var(--display); font-weight:800; font-size:20px;}
.score.na{color:var(--faint); font-size:15px; font-family:var(--mono); font-weight:500;}
.ring{--v:0; --c:var(--accent); width:42px; height:42px; border-radius:50%; display:grid; place-items:center; flex:none;
  background:conic-gradient(var(--c) calc(var(--v)*1%), var(--line) 0);}
.ring::after{content:attr(data-n); width:34px; height:34px; border-radius:50%; background:var(--surface); display:grid; place-items:center;
  font-family:var(--display); font-weight:800; font-size:13px; color:var(--ink);}
.newcard{border:1.5px dashed var(--line2); background:transparent; align-items:center; justify-content:center; color:var(--muted); min-height:170px; gap:8px; font-weight:600; font-size:14px;}
.newcard:hover{color:var(--ink); border-color:var(--accent); background:var(--surface2);}
.newcard svg{width:26px; height:26px;}

/* ============================ PROJECT ============================ */
.subnav{display:flex; gap:4px; flex-wrap:wrap; background:var(--surface); border:1px solid var(--line); border-radius:var(--r2); padding:5px; margin-bottom:22px; overflow-x:auto;}
.subnav button{display:inline-flex; align-items:center; gap:7px; font-weight:600; font-size:13px; color:var(--muted); padding:8px 13px; border-radius:var(--r1); transition:.14s; white-space:nowrap;}
.subnav button svg{width:15px; height:15px; stroke-width:1.9;}
.subnav button:hover{color:var(--ink); background:var(--surface2);}
.subnav button.on{color:#08130c; background:var(--accent);}
.subnav button .g{width:6px; height:6px; border-radius:50%; background:var(--amber);}
.subnav button.on .g{background:#08130c;}

.two{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
.three{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}

/* generated doc blocks */
.docblk{border:1px solid var(--line); border-radius:var(--r2); overflow:hidden; margin-bottom:12px; background:var(--surface);}
.docblk > .dh{display:flex; align-items:center; gap:9px; padding:11px 15px; border-bottom:1px solid var(--line); background:var(--surface2);}
.docblk > .dh .di{width:24px; height:24px; border-radius:7px; display:grid; place-items:center; background:color-mix(in srgb,var(--accent) 16%,transparent); color:var(--accent-deep);}
.docblk > .dh .di svg{width:14px; height:14px; stroke-width:2;}
.docblk > .dh h4{font-family:var(--serif); font-weight:700; font-size:14.5px;}
.docblk > .db{padding:15px; font-size:13.8px; line-height:1.62; color:var(--ink);}
.docblk .db p{color:var(--muted);} .docblk .db p + p{margin-top:8px;}
.docblk .db ul{list-style:none; display:flex; flex-direction:column; gap:8px;}
.docblk .db ul li{position:relative; padding-left:20px; color:var(--ink);}
.docblk .db ul li::before{content:''; position:absolute; left:4px; top:8px; width:6px; height:6px; border-radius:2px; background:var(--accent); transform:rotate(45deg);}
.docblk .db ul li b{color:var(--ink);}
.docblk .db ul li span{color:var(--muted);}
.kv{display:grid; grid-template-columns:auto 1fr; gap:6px 14px; font-size:13px;}
.kv dt{font-family:var(--mono); font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; padding-top:2px;}
.kv dd{color:var(--ink);}

.persona{border:1px solid var(--line); border-radius:var(--r2); padding:14px; background:var(--surface2);}
.persona .pa{display:flex; align-items:center; gap:11px; margin-bottom:9px;}
.persona .av{width:38px; height:38px; border-radius:50%; display:grid; place-items:center; font-family:var(--display); font-weight:800; color:#08130c; flex:none;}
.persona .pn{font-family:var(--serif); font-weight:700; font-size:15px;} .persona .pr{font-size:11.5px; color:var(--muted);}
.persona .quote{font-family:var(--serif); font-style:italic; font-size:13.5px; color:var(--ink); border-left:2px solid var(--accent); padding-left:11px; margin:9px 0;}

/* interview */
.chatlog{display:flex; flex-direction:column; gap:14px; margin-bottom:16px;}
.msg{display:flex; gap:11px; max-width:88%;}
.msg .mav{width:30px; height:30px; border-radius:9px; flex:none; display:grid; place-items:center; font-family:var(--serif); font-weight:800; font-size:13px;}
.msg.ai .mav{background:linear-gradient(140deg,var(--oxblood),#5e2224); color:#FAF6F4;}
.msg.me{margin-left:auto; flex-direction:row-reverse;}
.msg.me .mav{background:var(--accent); color:#08130c;}
.bubble{border:1px solid var(--line); border-radius:14px; padding:11px 15px; font-size:14px; line-height:1.55; background:var(--surface);}
.msg.ai .bubble{border-top-left-radius:4px;}
.msg.me .bubble{border-top-right-radius:4px; background:color-mix(in srgb,var(--accent) 12%,var(--surface)); border-color:color-mix(in srgb,var(--accent) 30%,var(--line));}
.thinking{display:inline-flex; gap:4px; align-items:center; padding:4px 0;}
.thinking i{width:6px; height:6px; border-radius:50%; background:var(--muted); animation:tk 1s infinite;}
.thinking i:nth-child(2){animation-delay:.15s;} .thinking i:nth-child(3){animation-delay:.3s;}
@keyframes tk{0%,60%,100%{opacity:.3; transform:translateY(0);} 30%{opacity:1; transform:translateY(-3px);}}

/* audit */
.scorewrap{display:flex; align-items:center; gap:22px; flex-wrap:wrap;}
.bigring{--v:0; --c:var(--accent); width:112px; height:112px; border-radius:50%; display:grid; place-items:center; flex:none;
  background:conic-gradient(var(--c) calc(var(--v)*1%), var(--line) 0);}
.bigring::after{content:attr(data-n); width:92px; height:92px; border-radius:50%; background:var(--surface); display:grid; place-items:center;
  font-family:var(--display); font-weight:800; font-size:30px;}
.catrow{display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--line);}
.catrow:last-child{border-bottom:0;}
.catrow .cn{font-size:13.5px; font-weight:500; width:150px; flex:none;}
.catrow .cbar{flex:1; height:8px; border-radius:99px; background:var(--surface2); border:1px solid var(--line); overflow:hidden;}
.catrow .cbar i{display:block; height:100%; border-radius:99px;}
.catrow .cv{font-family:var(--mono); font-size:12px; width:34px; text-align:right; color:var(--muted);}
.rec{display:flex; gap:11px; padding:12px 0; border-bottom:1px solid var(--line); font-size:13.5px;}
.rec:last-child{border:0;}
.rec .rc{width:22px; height:22px; border-radius:7px; flex:none; display:grid; place-items:center; font-family:var(--mono); font-size:10px; font-weight:600;}
.rec .rc.hi{background:color-mix(in srgb,var(--red) 18%,transparent); color:var(--red);}
.rec .rc.md{background:color-mix(in srgb,var(--amber) 20%,transparent); color:var(--amber);}
.rec .rc.lo{background:color-mix(in srgb,var(--accent) 18%,transparent); color:var(--accent-deep);}
.rec b{font-weight:600;} .rec .rt{color:var(--muted); line-height:1.5;}

/* graph */
.graphwrap{position:relative; border:1px solid var(--line); border-radius:var(--r3); overflow:hidden; background:
  radial-gradient(1px 1px at 20px 20px, var(--line) 1px, transparent 0) 0 0/26px 26px, var(--surface);}
#graph{display:block; width:100%; height:460px;}
.glegend{position:absolute; top:12px; left:12px; display:flex; gap:6px; flex-wrap:wrap; max-width:70%;}
.glegend .gl{display:inline-flex; align-items:center; gap:6px; font-size:11px; font-family:var(--mono); background:color-mix(in srgb,var(--surface) 86%,transparent); border:1px solid var(--line); border-radius:99px; padding:3px 9px; color:var(--muted);}
.glegend .gl i{width:8px; height:8px; border-radius:50%;}

/* memory */
.tl{position:relative; padding-left:26px;}
.tl::before{content:''; position:absolute; left:8px; top:6px; bottom:6px; width:2px; background:var(--line);}
.tlitem{position:relative; padding:0 0 20px;}
.tlitem::before{content:''; position:absolute; left:-22px; top:4px; width:12px; height:12px; border-radius:50%; background:var(--accent); border:3px solid var(--bg);}
.tlitem .tt{font-family:var(--serif); font-weight:700; font-size:15px;}
.tlitem .tm{font-family:var(--mono); font-size:10.5px; color:var(--muted); margin:2px 0 6px;}
.tlitem .tw{font-size:13.5px; color:var(--muted); line-height:1.55;}
.tlitem .tw b{color:var(--ink); font-weight:600;}

/* team */
.teamgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:14px;}
.spec{border:1px solid var(--line); border-radius:var(--r3); padding:18px; background:linear-gradient(180deg,var(--surface),var(--surface2)); transition:.15s;}
.spec:hover{border-color:var(--line2); transform:translateY(-2px); box-shadow:var(--shadow);}
.spec .sh{display:flex; align-items:center; gap:11px; margin-bottom:11px;}
.spec .sav{width:40px; height:40px; border-radius:12px; flex:none; display:grid; place-items:center; font-family:var(--serif); font-weight:800; font-size:16px; color:#08130c;}
.spec .sn{font-family:var(--serif); font-weight:700; font-size:15.5px; line-height:1.1;}
.spec .sr{font-family:var(--mono); font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em;}
.spec .sm{font-size:13px; color:var(--muted); line-height:1.5;}
.spec .sb{margin-top:11px; padding-top:11px; border-top:1px solid var(--line); font-size:11.5px; color:var(--muted);}
.spec .sb b{color:var(--ink); font-weight:600;}

/* design system gallery */
.swatch{height:60px; border-radius:var(--r2); border:1px solid var(--line); display:flex; align-items:flex-end; padding:7px 9px; font-family:var(--mono); font-size:10px; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.4);}
.compdemo{display:flex; gap:10px; flex-wrap:wrap; align-items:center; padding:16px; border:1px solid var(--line); border-radius:var(--r2); background:var(--surface2);}

/* confidence / risk meters (AI components) */
.meter{display:flex; align-items:center; gap:10px; font-size:12px; color:var(--muted);}
.meter .mb{flex:1; height:6px; border-radius:99px; background:var(--surface2); border:1px solid var(--line); overflow:hidden; min-width:80px;}
.meter .mb i{display:block; height:100%;}

/* empty state */
.empty{text-align:center; padding:46px 20px; color:var(--muted);}
.empty .ei{width:54px; height:54px; margin:0 auto 14px; border-radius:16px; display:grid; place-items:center; background:var(--surface2); border:1px solid var(--line);}
.empty .ei svg{width:26px; height:26px; color:var(--muted);}

/* ============================ MODAL / PALETTE / TOAST ============================ */
.scrim{position:fixed; inset:0; background:rgba(0,0,0,.5); backdrop-filter:blur(4px); z-index:40; display:grid; opacity:0; pointer-events:none; transition:.18s;}
.scrim.show{opacity:1; pointer-events:auto;}
.modal{place-self:center; width:min(560px,92vw); max-height:86vh; overflow:auto; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r4); box-shadow:var(--shadow); padding:26px; transform:translateY(8px) scale(.99); transition:.18s var(--ease);}
.scrim.show .modal{transform:none;}
.palette{place-self:start center; margin-top:12vh; width:min(600px,94vw); background:var(--surface); border:1px solid var(--line2);
  border-radius:var(--r3); box-shadow:var(--shadow); overflow:hidden; transform:translateY(-8px); transition:.18s var(--ease);}
.scrim.show .palette{transform:none;}
.palette .pin{display:flex; align-items:center; gap:11px; padding:15px 18px; border-bottom:1px solid var(--line);}
.palette .pin svg{width:18px; height:18px; color:var(--muted);}
.palette .pin input{border:0; background:none; padding:0; font-size:16px;}
.palette .pin input:focus{outline:none;}
.palette .plist{max-height:52vh; overflow:auto; padding:8px;}
.palette .pitem{display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:var(--r1); cursor:pointer; font-size:14px;}
.palette .pitem .pk{width:26px; height:26px; border-radius:7px; display:grid; place-items:center; background:var(--surface2); border:1px solid var(--line); color:var(--muted);}
.palette .pitem .pk svg{width:15px; height:15px;}
.palette .pitem .pmeta{margin-left:auto; font-family:var(--mono); font-size:10.5px; color:var(--faint);}
.palette .pitem.sel, .palette .pitem:hover{background:var(--surface2);}
.palette .pitem.sel{box-shadow:inset 0 0 0 1px var(--accent);}

.toasts{position:fixed; bottom:22px; left:50%; transform:translateX(-50%); z-index:60; display:flex; flex-direction:column; gap:8px; align-items:center;}
.toast{background:var(--ink); color:var(--bg); font-size:13px; font-weight:500; padding:10px 16px; border-radius:99px; box-shadow:var(--shadow);
  display:flex; align-items:center; gap:9px; animation:tin .3s var(--ease);}
.toast svg{width:15px; height:15px;}
@keyframes tin{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:none;}}

/* mobile */
.mobar{display:none;}
@media (max-width:900px){
  .app{grid-template-columns:1fr;}
  aside{display:none;}
  .scroll{padding:20px 16px 92px;}
  .topbar{padding:11px 16px;}
  .cmdk{min-width:auto;} .cmdk span.lbl, .cmdk .kbd{display:none;}
  .two,.three{grid-template-columns:1fr;}
  .mobar{display:flex; position:fixed; bottom:0; left:0; right:0; z-index:30; background:color-mix(in srgb,var(--bg) 92%,transparent);
    backdrop-filter:blur(12px); border-top:1px solid var(--line); padding:8px 6px calc(8px + env(safe-area-inset-bottom)); justify-content:space-around;}
  .mobar a{display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--muted); font-size:10px; font-weight:600; padding:4px 10px; border-radius:var(--r1);}
  .mobar a.on{color:var(--accent);}
  .mobar a svg{width:21px; height:21px; stroke-width:1.9;}
  .hero .h1{font-size:26px;} .h1{font-size:25px;}
  .launcher{flex-direction:column;}
  .scorewrap{gap:16px;}
}
/* AI streaming */
.aistream{font-family:var(--mono); font-size:12px; line-height:1.6; white-space:pre-wrap; word-break:break-word;
  background:#0a0d0c; color:var(--muted); border:1px solid var(--line); border-radius:var(--r2); padding:13px 15px; max-height:300px; overflow:auto;}
html[data-theme="light"] .aistream{background:var(--surface2); color:var(--muted);}
.aistream .cursor{display:inline-block; width:7px; height:14px; background:var(--accent); margin-left:1px; vertical-align:text-bottom; animation:blink 1s step-end infinite;}
@keyframes blink{50%{opacity:0;}}
.aibadge{display:inline-flex; align-items:center; gap:6px; font-family:var(--mono); font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--accent-deep); border:1px solid color-mix(in srgb,var(--accent) 40%,transparent); border-radius:99px; padding:3px 9px;}
.aibadge i{width:6px; height:6px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 0 var(--accent); animation:pulse 1.6s infinite;}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 60%,transparent);}70%{box-shadow:0 0 0 6px transparent;}100%{box-shadow:0 0 0 0 transparent;}}
.hidden{display:none!important;}
</style>
</head>

<script>
"use strict";
/* ============================================================
   SYMBOLIC — AI Product Operating System · Phase 1 (Symbolic Core)
   Single-file reference implementation. Client-only, localStorage.
   ============================================================ */
const $ = (s,r=document)=>r.querySelector(s);
const el=(t,a={},...kids)=>{const n=document.createElement(t);
  for(const[k,v]of Object.entries(a)){ if(k==='class')n.className=v; else if(k==='html')n.innerHTML=v; else if(k.startsWith('on'))n.addEventListener(k.slice(2),v); else if(v!=null)n.setAttribute(k,v);}
  for(const kid of kids.flat()){ if(kid!=null) n.append(kid.nodeType?kid:document.createTextNode(kid)); } return n;};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const now=()=>Date.now();
const fmtDate=t=>new Date(t).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
const fmtTime=t=>new Date(t).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
function icon(p){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;}
const ICON={
  workspace:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  team:'<circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0"/><path d="M16 5.5a3 3 0 0 1 0 5.5"/><path d="M17 14a6 6 0 0 1 4 6"/>',
  system:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',
  overview:'<path d="M4 5h16M4 12h10M4 19h7"/>',
  pm:'<path d="M8 10h8M8 14h5"/><rect x="3" y="4" width="18" height="16" rx="2"/>',
  ux:'<rect x="3" y="4" width="18" height="14" rx="2"/><path d="M3 9h18M8 18v3M16 18v3M7 21h10"/>',
  arch:'<path d="M3 21h18M6 21V9l6-4 6 4v12M10 21v-5h4v5"/>',
  eng:'<path d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8"/><circle cx="12" cy="12" r="3"/>',
  audit:'<path d="M9 11l3 3 8-8"/><path d="M21 12v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/>',
  graph:'<circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="7" r="2.5"/><circle cx="12" cy="17" r="2.5"/><path d="M8 7l8 8M8.4 7.4l7-.4M16 9l-3 5.5"/>',
  memory:'<path d="M12 8v4l3 2"/><circle cx="12" cy="12" r="9"/>',
  roadmap:'<path d="M4 20V8l8-4 8 4v12"/><path d="M4 12h16M12 4v16"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  spark:'<path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/>',
  send:'<path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/>',
  down:'<path d="M12 3v14M6 11l6 6 6-6M5 21h14"/>',
  trash:'<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>',
  moon:'<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M19 5l-1.5 1.5M6.5 17.5 5 19"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  book:'<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 5v14"/>',
};

/* ---------------- STATE ---------------- */
const KEY='symbolic.workspace.v1';
let S = load();
function load(){
  try{const v=JSON.parse(localStorage.getItem(KEY)); if(v&&v.version===1) return v;}catch(e){}
  return {version:1, settings:{theme:'auto', aiEndpoint:'', aiKey:''}, projects:{}, activeProjectId:null};
}
let saveT; function save(){clearTimeout(saveT); saveT=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}},120);}
const P = id => S.projects[id];

/* ---------------- THEME ---------------- */
function applyTheme(){
  const t = S.settings.theme;
  const eff = t==='auto' ? (matchMedia('(prefers-color-scheme: light)').matches?'light':'dark') : t;
  document.documentElement.setAttribute('data-theme', eff);
  const b=$('#themeToggle');
  b.innerHTML = (eff==='dark'?icon(ICON.sun):icon(ICON.moon)) + `<span>${t==='auto'?'Auto theme':eff==='dark'?'Dark':'Light'}</span>`;
}
$('#themeToggle').addEventListener('click',()=>{
  const order=['auto','light','dark']; const i=order.indexOf(S.settings.theme);
  S.settings.theme=order[(i+1)%3]; save(); applyTheme();
});
matchMedia('(prefers-color-scheme: light)').addEventListener('change',()=>{ if(S.settings.theme==='auto') applyTheme(); });

/* ---------------- TOASTS ---------------- */
function toast(msg, ok=true){
  const t=el('div',{class:'toast'}, ok?el('span',{html:icon(ICON.check)}):null, msg);
  t.querySelector('svg')?.style && (t.querySelector('svg').style.color='var(--accent)');
  $('#toasts').append(t); setTimeout(()=>{t.style.opacity='0'; t.style.transform='translateY(8px)'; setTimeout(()=>t.remove(),250);},2400);
}

/* ============================================================
   DOMAIN INTELLIGENCE — tailors generated artifacts to the idea
   ============================================================ */
const DOMAINS=[
  {k:'inventory',rx:/invent|stock|warehouse|supply|parts|sku|plumb|hardware|logisti/i,
   noun:'inventory',users:['field technicians','warehouse managers','procurement leads'],
   features:['Barcode / QR scanning','Stock levels & low-stock alerts','Supplier & purchase orders','Multi-location tracking','Usage history & audit log','Offline-first mobile capture'],
   stack:['Next.js + React Native (Expo) for field use','Postgres (Supabase) with row-level security','Edge functions for sync','Background jobs for reorder alerts'],
   entities:['Item','Location','StockMovement','Supplier','PurchaseOrder','User']},
  {k:'marketplace',rx:/marketplace|two-?sided|buyers? and sellers|vendors|gig|freelanc|rental/i,
   noun:'marketplace',users:['buyers','sellers/providers','platform operators'],
   features:['Dual onboarding (buyer & seller)','Search, filters & discovery','Listings & availability','Escrow / split payments','Ratings & reviews','Messaging & disputes'],
   stack:['Next.js (App Router)','Stripe Connect for split payments','Postgres + full-text search','Typesense/Algolia for discovery'],
   entities:['User','Listing','Order','Payment','Review','Message']},
  {k:'social',rx:/social|communit|feed|follow|network|forum|creator/i,
   noun:'social product',users:['creators','members','moderators'],
   features:['Profiles & follows','Activity feed & ranking','Posts, media & reactions','Notifications','Moderation & reporting','Discovery / trending'],
   stack:['Next.js + WebSockets for realtime','Postgres + Redis for feeds','CDN for media','Edge caching for the feed'],
   entities:['User','Post','Follow','Reaction','Comment','Notification']},
  {k:'health',rx:/health|patient|clinic|medical|therap|wellness|fitness|care/i,
   noun:'health product',users:['patients / clients','providers / coaches','clinic admins'],
   features:['Secure profiles & intake','Appointment scheduling','Progress tracking & charts','Messaging (HIPAA-aware)','Care plans & reminders','Reports & exports'],
   stack:['Next.js with strict RBAC','Postgres with encryption at rest','Audit logging on every PHI access','SOC2/HIPAA-aligned hosting'],
   entities:['Patient','Provider','Appointment','Record','Message','CarePlan']},
  {k:'fintech',rx:/financ|payment|bank|invoice|budget|crypto|wallet|expense|accounting/i,
   noun:'fintech product',users:['account holders','finance teams','administrators'],
   features:['Secure onboarding & KYC','Balances & transactions','Transfers / payments','Statements & exports','Alerts & limits','Reconciliation'],
   stack:['Next.js + typed API layer','Postgres with double-entry ledger','Idempotent payment jobs','Strong audit + fraud checks'],
   entities:['Account','Transaction','Ledger','Statement','User','AlertRule']},
  {k:'education',rx:/learn|course|educat|student|teach|training|academy|quiz|school/i,
   noun:'learning product',users:['learners','instructors','admins'],
   features:['Course & lesson builder','Progress & XP tracking','Quizzes & assessments','Certificates','Cohorts & discussion','Analytics for instructors'],
   stack:['Next.js + MDX for lessons','Postgres for progress','Video via Mux/CDN','Background grading jobs'],
   entities:['Course','Lesson','Enrollment','Submission','User','Certificate']},
  {k:'booking',rx:/book|appointment|reserv|schedul|calendar|salon|restaurant|event/i,
   noun:'booking product',users:['customers','staff / providers','owners'],
   features:['Availability calendar','Online booking & rescheduling','Reminders (SMS/email)','Payments & deposits','Staff management','No-show handling'],
   stack:['Next.js','Postgres with time-zone-safe slots','Twilio/Resend for reminders','Stripe for deposits'],
   entities:['Service','Slot','Booking','Customer','Staff','Payment']},
  {k:'ecommerce',rx:/shop|store|ecommerce|e-commerce|product catalog|checkout|cart|retail/i,
   noun:'commerce product',users:['shoppers','merchants','support'],
   features:['Catalog & variants','Cart & checkout','Payments & tax','Order fulfillment','Discounts & promotions','Customer accounts'],
   stack:['Next.js commerce','Stripe + tax provider','Postgres for orders','Search + CDN for media'],
   entities:['Product','Variant','Cart','Order','Customer','Discount']},
];
const GENERIC={k:'app',noun:'product',users:['primary users','power users','administrators'],
  features:['Onboarding & auth','Core workflow','Dashboard & search','Notifications','Settings & profile','Admin & analytics'],
  stack:['Next.js (App Router) + TypeScript','Supabase (Postgres + Auth)','React Query + Zustand','Vercel Edge deployment'],
  entities:['User','Workspace','Item','Activity','Setting']};
function domainOf(idea){ const s=idea||''; return DOMAINS.find(d=>d.rx.test(s))||GENERIC; }
function titleCase(s){return (s||'').replace(/\b\w/g,c=>c.toUpperCase());}
/* derive a friendly product name from an idea */
function nameFromIdea(idea){
  let s=(idea||'').trim().replace(/^(i (want|need|would like) to |build (me )?a?n? ?|create (a|an)? ?|make (a|an)? ?|an? )/i,'');
  s=s.replace(/\bapp\b|\bplatform\b|\btool\b|\bproduct\b|\bwebsite\b/ig,'').trim();
  s=s.split(/[.,\n]/)[0].split(' ').slice(0,4).join(' ');
  return titleCase(s||'New Product');
}

/* ============================================================
   PROJECT FACTORY
   ============================================================ */
const STAGES=['idea','research','validation','requirements','design','engineering','testing','launch','iteration'];
function newProject(idea){
  const d=domainOf(idea);
  const pr={ id:uid(), name:nameFromIdea(idea), idea:idea.trim(), createdAt:now(), stage:'idea',
    overview:{
      vision:`A ${d.noun} that makes ${d.users[0]} dramatically faster and calmer at their core job.`,
      mission:`Give ${d.users[0]} one trustworthy place to ${idea.replace(/^.*?(build|create|make)\s+/i,'').trim()||'get the job done'} — without the busywork.`,
      users:d.users.map(titleCase).join(', '),
      competitors:'Spreadsheets · legacy incumbents · in-house tools · doing nothing'
    },
    pm:{interview:[], brief:null},
    ux:null, arch:null, eng:null,
    audit:{scores:null, recs:[], scoredAt:null},
    memory:[], graph:null
  };
  logDecision(pr,'Project created',`Founder started with the idea: “${pr.idea}”. Symbolic detected the <b>${d.k}</b> domain and pre-seeded vision, users, and competitors.`,'CEO AI');
  S.projects[pr.id]=pr; S.activeProjectId=pr.id; save(); return pr;
}
function logDecision(pr,title,why,who){ pr.memory.unshift({id:uid(),ts:now(),title,why,who}); }
function delProject(id){ delete S.projects[id]; if(S.activeProjectId===id)S.activeProjectId=null; save(); }

/* ---------- interview questions (adaptive) ---------- */
function nextQuestion(pr){
  const asked=pr.pm.interview.length;
  const d=domainOf(pr.idea);
  const bank=[
    `Let's sharpen the target. Among ${d.users.join(', ')} — who feels this pain the most acutely, and when?`,
    `What does that person do *today* to cope? Walk me through their current workaround.`,
    `If Symbolic nailed exactly one thing in the MVP, what single outcome would make them say “I can't go back”?`,
    `What's the riskiest assumption we're making — the thing that, if wrong, sinks the whole idea?`,
    `How will we know it's working in month one? Name a number you'd actually watch.`,
  ];
  return bank[asked] || null;

/* ============================================================
   REAL STREAMING AI  (Milestone 2)
   Talks to the /api/ai Edge proxy. Streams tokens live; falls back
   to local synthesis whenever no endpoint is set or a call fails.
   ============================================================ */
function hasAI(){ return !!((S.settings.aiEndpoint||'').trim()); }
function aiModel(){ return (S.settings.aiModel||'').trim() || undefined; }

// Stream from the proxy. Calls onToken(textDelta) as tokens arrive; resolves
// with the full text. Throws on any transport / server / abort error.
async function streamAI({system, messages, max_tokens=2048, onToken, signal}={}){
  const url=(S.settings.aiEndpoint||'').trim();
  if(!url) throw new Error('No AI endpoint configured');
  const res=await fetch(url,{method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({system, messages, max_tokens, model:aiModel(), stream:true}), signal});
  if(!res.ok){ let m; try{m=(await res.json()).error;}catch(e){} throw new Error(m||('HTTP '+res.status)); }
  const ct=res.headers.get('content-type')||'';
  if(ct.includes('application/json')){ // proxy answered non-streaming (or an error)
    const d=await res.json(); if(d.error) throw new Error(d.error);
    const t=d.text||''; if(onToken&&t) onToken(t); return t;
  }
  const reader=res.body.getReader(); const dec=new TextDecoder(); let buf='', full='';
  for(;;){
    const {done,value}=await reader.read(); if(done) break;
    buf+=dec.decode(value,{stream:true});
    let nl;
    while((nl=buf.indexOf('\n'))>=0){
      const line=buf.slice(0,nl).trim(); buf=buf.slice(nl+1);
      if(!line.startsWith('data:')) continue;
      const data=line.slice(5).trim(); if(!data||data==='[DONE]') continue;
      let evt; try{ evt=JSON.parse(data); }catch(e){ continue; }
      if(evt.type==='content_block_delta' && evt.delta?.type==='text_delta'){ full+=evt.delta.text; onToken&&onToken(evt.delta.text); }
      else if(evt.type==='error'){ throw new Error(evt.error?.message||'stream error'); }
    }
  }
  return full;
}
async function callAI(opts){ return streamAI(opts); } // non-streaming convenience

function parseJSON(t){
  let s=String(t||'').trim();
  const fence=s.match(/```(?:json)?\s*([\s\S]*?)```/i); if(fence) s=fence[1].trim();
  const a=s.indexOf('{'), b=s.lastIndexOf('}'); if(a>=0 && b>a) s=s.slice(a,b+1);
  return JSON.parse(s);
}

// Build the shared project context every specialist prompt starts from.
function projContext(p, kind){
  const d=domainOf(p.idea);
  let c=`Product: ${p.name}\nOne-line idea: ${p.idea}\nDetected domain: ${d.k}\n`+
        `Vision: ${p.overview.vision}\nMission: ${p.overview.mission}\nUsers: ${p.overview.users}\nCompetitors: ${p.overview.competitors}`;
  if(p.pm.interview.length){
    c+='\n\nFounder interview:\n'+p.pm.interview.map(qa=>`Q: ${qa.q}\nA: ${qa.a||'(skipped)'}`).join('\n');

}

// Stream an artifact into a live modal, parse JSON, apply — or fall back.
async function aiArtifact(kind,p){
  const cfg=AI_KINDS[kind];
  const m=$('#modal'); m.innerHTML='';
  m.append(el('div',{class:'between',style:'margin-bottom:14px'},
    el('div',{class:'h2'},cfg.title),
    el('span',{class:'aibadge'},el('i'),'Claude · streaming')));
  const status=el('div',{class:'row',style:'margin-bottom:12px'},
    el('div',{class:'thinking'},el('i'),el('i'),el('i')),
    el('span',{class:'muted',style:'font-size:13px'},cfg.working));
  const pre=el('div',{class:'aistream'});
  const cur=el('span',{class:'cursor'});
  m.append(status,pre); pre.append(cur);
  $('#modalScrim').classList.add('show');
  let raw='';
  const onToken=t=>{ raw+=t; cur.remove(); pre.textContent=raw; pre.append(cur); pre.scrollTop=pre.scrollHeight; };
  try{
    await streamAI({ system:cfg.build(p).system, messages:[{role:'user',content:cfg.build(p).user}], max_tokens:cfg.max, onToken });
    const obj=parseJSON(raw);
    cfg.apply(p,obj); save(); closeModal(); toast(cfg.done); render();
  }catch(e){
    console.warn('aiArtifact('+kind+') fell back:',e);
    try{ LOCAL_GEN[kind](p); save(); }catch(e2){}
    closeModal(); toast('AI unavailable — generated locally', false); render();
  }
}

function interviewMessages(p){
  const msgs=[{role:'user',content:`My product idea: "${p.idea}". Please interview me to understand it — ask your first question.`}];
  p.pm.interview.forEach(qa=>{ msgs.push({role:'assistant',content:qa.q}); if(qa.a!=null) msgs.push({role:'user',content:qa.a}); });

}
const PM_SYSTEM="You are the AI Product Manager inside Symbolic, an AI product operating system. Interview the founder to fully understand their product. Ask ONE sharp, specific question at a time — probe the target user, their current workaround, the single wedge feature, the riskiest assumption, and the success metric. Each question is 1–2 sentences, no preamble, no numbering. After about five exchanges you'll have enough. Ask only the next question.";

async function askNextQuestion(p, bubbleBody){
  const cursor=el('span',{class:'cursor'}); bubbleBody.textContent=''; bubbleBody.append(cursor);
  let full='';
  try{
    await streamAI({ system:PM_SYSTEM, messages:interviewMessages(p), max_tokens:400,
      onToken:t=>{ full+=t; cursor.remove(); bubbleBody.textContent=full; bubbleBody.append(cursor); } });
  }catch(e){
    // fall back to the canned bank so the interview still works offline
    full = nextQuestion(p) || 'Tell me more about who this is for and why now.';
    bubbleBody.textContent=full;
  }
  cursor.remove();
  p.pm.interview.push({q:full.trim(), a:null}); save();
  return full.trim();
}

function tabPMAI(v,p){
  v.append(tabHead('AI Product Manager', 'A live interview with Claude — answer, and it adapts. Then it streams a full brief.',
    [ el('span',{class:'aibadge'},el('i'),'Live AI'),
      p.pm.brief?el('button',{class:'btn ghost sm',html:icon(ICON.spark)+'Regenerate brief',onclick:()=>runGen('brief',p)}):null ]));

  const card=el('div',{class:'card'});
  card.append(el('div',{class:'eyebrow',style:'margin-bottom:14px'},'Founder interview'));
  const log=el('div',{class:'chatlog'});
  log.append(msg('ai',`Let's understand <b>${esc(p.name)}</b>. I'll ask a few sharp questions, then write the brief.`));
  p.pm.interview.forEach(qa=>{ log.append(msg('ai',esc(qa.q))); if(qa.a) log.append(msg('me',esc(qa.a))); });
  card.append(log);
  const foot=el('div',{}); card.append(foot);
  v.append(card);

  const last=p.pm.interview[p.pm.interview.length-1];
  const awaiting=last && last.a==null;

  function answerForm(){
    foot.innerHTML='';
    const form=el('form',{class:'row',style:'margin-top:6px', onsubmit:e=>{e.preventDefault();
      const val=$('#ansInput').value.trim(); if(!val)return;
      const cur=p.pm.interview[p.pm.interview.length-1]; if(cur) cur.a=val; save();
      log.append(msg('me',esc(val))); foot.innerHTML=''; ask(); }});
    const inp=el('input',{type:'text',id:'ansInput',placeholder:'Your answer…','aria-label':'Answer'});
    form.append(inp, el('button',{class:'btn primary',type:'submit',html:icon(ICON.send)}));
    foot.append(form); setTimeout(()=>inp.focus(),40);
  }
  async function ask(){
    const b=msg('ai',''); log.append(b); const body=b.querySelector('.bubble');
    await askNextQuestion(p, body);
    if(p.pm.interview.length>=6) doneBar(); else answerForm();
  }
  function doneBar(){
    foot.innerHTML='';
    foot.append(el('div',{class:'row',style:'margin-top:8px'}, el('span',{class:'badge ok dot'},'Enough to synthesize'),
      el('span',{class:'muted',style:'font-size:13px'},'Generate the brief, or keep talking.')));
  }
  const actions=el('div',{class:'row',style:'margin-top:14px'});
  actions.append(el('button',{class:'btn primary',html:icon(ICON.spark)+(p.pm.brief?'Regenerate brief':'Generate brief'),onclick:()=>runGen('brief',p)}));
  if(p.pm.interview.length) actions.append(el('button',{class:'btn ghost sm',html:'Reset interview',onclick:()=>{p.pm.interview=[]; save(); render();}}));
  card.append(actions);

  if(awaiting) answerForm();
  else if(!p.pm.interview.length) ask();               // stream the very first question
  else doneBar();

  renderBrief(v,p);
}

function drawGraph(canvas,g){
  const dpr=Math.min(devicePixelRatio||1,2); const W=canvas.clientWidth, H=460;
  canvas.width=W*dpr; canvas.height=H*dpr; const ctx=canvas.getContext('2d'); ctx.scale(dpr,dpr);
  const N=g.nodes.map((n,i)=>({...n, x:W/2+Math.cos(i/g.nodes.length*6.28)*Math.min(W,H)*0.32+(i%3-1)*20, y:H/2+Math.sin(i/g.nodes.length*6.28)*H*0.32, vx:0,vy:0}));
  const byId=Object.fromEntries(N.map(n=>[n.id,n]));
  const L=g.links.map(l=>({s:byId[l.s],t:byId[l.t]})).filter(l=>l.s&&l.t);
  const css=getComputedStyle(document.documentElement);
  const line=css.getPropertyValue('--line2')||'#333'; const ink=css.getPropertyValue('--ink')||'#eee';
  let drag=null, hover=null, raf, ticks=0;
  function step(){
    // simple force layout
    for(const a of N){ for(const b of N){ if(a===b)continue; let dx=a.x-b.x,dy=a.y-b.y,d2=dx*dx+dy*dy||1; let f=1400/d2; a.vx+=dx*f*0.0016; a.vy+=dy*f*0.0016; } }
    for(const l of L){ let dx=l.t.x-l.s.x,dy=l.t.y-l.s.y,d=Math.hypot(dx,dy)||1,f=(d-110)*0.008; l.s.vx+=dx/d*f; l.s.vy+=dy/d*f; l.t.vx-=dx/d*f; l.t.vy-=dy/d*f; }
    for(const n of N){ n.vx+=(W/2-n.x)*0.001; n.vy+=(H/2-n.y)*0.001; if(n!==drag){ n.x+=n.vx*=.86; n.y+=n.vy*=.86;} n.x=Math.max(60,Math.min(W-60,n.x)); n.y=Math.max(34,Math.min(H-34,n.y)); }
    draw(); if(ticks++<260||drag) raf=requestAnimationFrame(step);
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    ctx.lineWidth=1.4;
    for(const l of L){ ctx.strokeStyle=line; ctx.globalAlpha=.7; ctx.beginPath(); ctx.moveTo(l.s.x,l.s.y);
      const mx=(l.s.x+l.t.x)/2,my=(l.s.y+l.t.y)/2-14; ctx.quadraticCurveTo(mx,my,l.t.x,l.t.y); ctx.stroke(); }
    ctx.globalAlpha=1;
    for(const n of N){ const hue=NODE_HUE[n.kind]||150; const r=n.kind==='idea'?15:11;
      ctx.beginPath(); ctx.arc(n.x,n.y,r+ (n===hover?3:0),0,6.29);
      ctx.fillStyle=`hsl(${hue} 70% 55%)`; ctx.shadowColor=`hsl(${hue} 70% 55%)`; ctx.shadowBlur=n===hover?16:8; ctx.fill(); ctx.shadowBlur=0;
      ctx.fillStyle=ink.trim(); ctx.font='500 11px Inter, sans-serif'; ctx.textAlign='center';
      ctx.fillText(n.label.length>16?n.label.slice(0,15)+'…':n.label, n.x, n.y+r+13);
    }
  }
  function pos(e){const rect=canvas.getBoundingClientRect(); const cx=(e.touches?e.touches[0].clientX:e.clientX)-rect.left, cy=(e.touches?e.touches[0].clientY:e.clientY)-rect.top; return {cx,cy};}
  function pick(cx,cy){ return N.find(n=>Math.hypot(n.x-cx,n.y-cy)<16); }
  canvas.onmousedown=e=>{const{cx,cy}=pos(e); drag=pick(cx,cy); };
  canvas.onmousemove=e=>{const{cx,cy}=pos(e); if(drag){drag.x=cx;drag.y=cy;drag.vx=drag.vy=0;} else {hover=pick(cx,cy); canvas.style.cursor=hover?'grab':'default';} if(!raf)step();};
  window.addEventListener('mouseup',()=>{drag=null;});
  canvas.ontouchstart=e=>{const{cx,cy}=pos(e); drag=pick(cx,cy); if(drag)e.preventDefault();};
  canvas.ontouchmove=e=>{if(!drag)return; e.preventDefault(); const{cx,cy}=pos(e); drag.x=cx;drag.y=cy;drag.vx=drag.vy=0; if(!raf)step();};
  canvas.ontouchend=()=>{drag=null;};
  step();
}

  document.body.append(a); a.click(); a.remove(); toast('Exported JSON');
}

/* ---- command palette ---- */
let paletteItems=[], paletteSel=0;
function openPalette(){
  buildPaletteItems(''); $('#paletteScrim').classList.add('show'); const i=$('#paletteInput'); i.value=''; setTimeout(()=>i.focus(),30);
}
function closePalette(){ $('#paletteScrim').classList.remove('show'); }
function buildPaletteItems(q){
  q=q.toLowerCase();
  const items=[];
  NAV.forEach(n=>items.push({label:n.label,meta:'section',icon:n.icon,go:'#/'+n.id}));
  Object.values(S.projects).forEach(p=>{ items.push({label:p.name,meta:'project',icon:ICON.spark,go:'#/p/'+p.id+'/overview'});
    PROJ_TABS.forEach(t=>items.push({label:p.name+' — '+t.label,meta:'tab',icon:t.icon,go:'#/p/'+p.id+'/'+t.id})); });
  items.push({label:'New product',meta:'action',icon:ICON.plus,go:'#/workspace',act:()=>setTimeout(()=>$('#ideaInput')?.focus(),50)});
  items.push({label:'Settings',meta:'action',icon:ICON.system,act:openSettings});
  paletteItems=items.filter(it=>it.label.toLowerCase().includes(q)).slice(0,40); paletteSel=0; renderPalette();
}
function renderPalette(){
  const list=$('#paletteList'); list.innerHTML='';
  if(!paletteItems.length){ list.append(el('div',{class:'empty',style:'padding:24px'},'No matches')); return; }
  paletteItems.forEach((it,i)=>{ const row=el('div',{class:'pitem'+(i===paletteSel?' sel':''), onclick:()=>runPalette(it)});
    row.innerHTML=`<span class="pk">${icon(it.icon)}</span><span>${esc(it.label)}</span><span class="pmeta">${it.meta}</span>`; list.append(row); });
}
function runPalette(it){ closePalette(); if(it.go) location.hash=it.go; if(it.act) it.act(); }
$('#openPalette').addEventListener('click',openPalette);
$('#paletteInput').addEventListener('input',e=>buildPaletteItems(e.target.value));
$('#paletteScrim').addEventListener('click',e=>{if(e.target.id==='paletteScrim')closePalette();});
$('#paletteInput').addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'){e.preventDefault(); paletteSel=Math.min(paletteSel+1,paletteItems.length-1); renderPalette(); scrollSel();}
  else if(e.key==='ArrowUp'){e.preventDefault(); paletteSel=Math.max(paletteSel-1,0); renderPalette(); scrollSel();}
  else if(e.key==='Enter'){e.preventDefault(); if(paletteItems[paletteSel]) runPalette(paletteItems[paletteSel]);}
});
function scrollSel(){ $('#paletteList .pitem.sel')?.scrollIntoView({block:'nearest'}); }

/* ---- global keys ---- */
window.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); $('#paletteScrim').classList.contains('show')?closePalette():openPalette(); }
  else if(e.key==='Escape'){ closePalette(); closeModal(); }
});

/* ============================================================
   BOOT — seed a demo project on first run
   ============================================================ */
function boot(){
  applyTheme();
  if(!Object.keys(S.projects).length){
    const demo=newProject('I want to build a plumbing inventory app for field technicians');
    demo.pm.interview=[
      {q:nextQuestion(demo), a:'Field technicians on job sites — they lose the most time hunting for parts.'},
    ];
    // advance the demo so the workspace looks alive
    genBrief(demo); genArch(demo); genUX(demo); genEng(demo); genAudit(demo);
    demo.stage='engineering'; S.activeProjectId=demo.id; save();
  }
  if(!location.hash) location.hash='#/workspace';
  render();
}
boot();
</script>
